name: Lambda Application Release

on:
  push:
    branches:
      - main
    paths:
      - "backend/students-api/**"
      - "backend/users-api/**"

  workflow_dispatch:
    inputs:
      api:
        description: API to release
        required: true
        type: choice
        options:
          - students-api
          - users-api
      commit_sha:
        description: Full commit SHA belonging to main
        required: true
        type: string

permissions:
  contents: read

jobs:
  select:
    name: Select release targets
    runs-on: ubuntu-latest
    outputs:
      apis: ${{ steps.select.outputs.apis }}
      commit_sha: ${{ steps.select.outputs.commit_sha }}

    steps:
      - name: Checkout main history
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate commit and select APIs
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          INPUT_API: ${{ inputs.api }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin main

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${WORKFLOW_REF}" == "refs/heads/main" ]] || {
              echo "Manual releases must run from refs/heads/main." >&2
              exit 1
            }
            [[ "${INPUT_COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "commit_sha must be a full lowercase Git commit SHA." >&2
              exit 1
            }
            git cat-file -e "${INPUT_COMMIT_SHA}^{commit}"
            git merge-base --is-ancestor "${INPUT_COMMIT_SHA}" origin/main || {
              echo "commit_sha does not belong to main history." >&2
              exit 1
            }
            [[ "${INPUT_API}" == "students-api" || "${INPUT_API}" == "users-api" ]]
            printf 'apis={"api":["%s"]}\n' "${INPUT_API}" >> "${GITHUB_OUTPUT}"
            printf 'commit_sha=%s\n' "${INPUT_COMMIT_SHA}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          [[ "${WORKFLOW_REF}" == "refs/heads/main" ]]
          [[ "${PUSH_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "${PUSH_SHA}" origin/main

          if [[ "${PUSH_BEFORE}" =~ ^0+$ ]]; then
            changed_files="$(git diff-tree --root --no-commit-id --name-only -r "${PUSH_SHA}")"
          else
            changed_files="$(git diff --name-only "${PUSH_BEFORE}" "${PUSH_SHA}")"
          fi

          apis="$(printf '%s\n' "${changed_files}" | python tools/lambda_release/select_targets.py)"
          printf 'apis=%s\n' "${apis}" >> "${GITHUB_OUTPUT}"
          printf 'commit_sha=%s\n' "${PUSH_SHA}" >> "${GITHUB_OUTPUT}"

  release:
    name: Release ${{ matrix.api }} to dev
    needs: select
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.apis) }}
    concurrency:
      group: lambda-release-dev-${{ matrix.api }}
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact approved commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.select.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Resolve release target
        shell: bash
        env:
          API: ${{ matrix.api }}
        run: |
          set -euo pipefail
          case "${API}" in
            students-api)
              function_name="serverless-student-manager-dev-students-api"
              ;;
            users-api)
              function_name="serverless-student-manager-dev-users-api"
              ;;
            *)
              echo "Unsupported API." >&2
              exit 1
              ;;
          esac
          printf 'FUNCTION_NAME=%s\n' "${function_name}" >> "${GITHUB_ENV}"
          printf 'ARTIFACT_PATH=%s/%s.zip\n' "${RUNNER_TEMP}" "${API}" >> "${GITHUB_ENV}"

      - name: Build deterministic artifact
        shell: bash
        env:
          API: ${{ matrix.api }}
        run: |
          set -euo pipefail
          python tools/lambda_release/build_artifact.py \
            --api "${API}" \
            --output "${ARTIFACT_PATH}"

      - name: Hash artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_sha256="$(sha256sum "${ARTIFACT_PATH}" | cut -d ' ' -f 1)"
          printf 'sha256=%s\n' "${artifact_sha256}" >> "${GITHUB_OUTPUT}"
          printf 'Artifact SHA-256: %s\n' "${artifact_sha256}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::590183756378:role/student-manager-github-dev-deploy
          aws-region: us-east-1

      - name: Publish version and promote live alias
        id: release
        shell: bash
        env:
          API: ${{ matrix.api }}
          API_BASE_URL: https://ymed78r9jh.execute-api.us-east-1.amazonaws.com
          COMMIT_SHA: ${{ needs.select.outputs.commit_sha }}
        run: |
          set -euo pipefail
          python tools/lambda_release/release.py \
            --api "${API}" \
            --function-name "${FUNCTION_NAME}" \
            --artifact "${ARTIFACT_PATH}" \
            --api-base-url "${API_BASE_URL}" \
            --output-file "${GITHUB_OUTPUT}"

      - name: Record release summary
        shell: bash
        env:
          API: ${{ matrix.api }}
          COMMIT_SHA: ${{ needs.select.outputs.commit_sha }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
          PREVIOUS_VERSION: ${{ steps.release.outputs.previous_version }}
          PUBLISHED_VERSION: ${{ steps.release.outputs.published_version }}
          ALIAS_VERSION: ${{ steps.release.outputs.alias_version }}
        run: |
          set -euo pipefail
          {
            echo "### Lambda release"
            echo "- environment: dev"
            echo "- API: ${API}"
            echo "- function: ${FUNCTION_NAME}"
            echo "- commit: ${COMMIT_SHA}"
            echo "- artifact SHA-256: ${ARTIFACT_SHA256}"
            echo "- previous version: ${PREVIOUS_VERSION}"
            echo "- published version: ${PUBLISHED_VERSION}"
            echo "- alias live: ${ALIAS_VERSION}"
          } >> "${GITHUB_STEP_SUMMARY}"
