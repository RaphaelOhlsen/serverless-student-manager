name: OpenAPI CI

on:
  pull_request:
    paths: [docs/api/openapi.yaml, redocly.yaml, package.json, package-lock.json, .github/workflows/openapi-ci.yml]
  push:
    branches: [main]
    paths: [docs/api/openapi.yaml, redocly.yaml, package.json, package-lock.json, .github/workflows/openapi-ci.yml]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run openapi:lint
