name: Frontend E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/frontend-e2e.yml"
      - "frontend/.env.example"
      - "frontend/.gitignore"
      - "frontend/e2e/**"
      - "frontend/index.html"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/playwright.config.ts"
      - "frontend/public/**"
      - "frontend/src/**"
      - "frontend/tsconfig*.json"
      - "frontend/vite.config.ts"
      - "!frontend/**/*.md"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Chromium public smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    env:
      CI: "true"
      VITE_COGNITO_USER_POOL_ID: us-east-1_example
      VITE_COGNITO_USER_POOL_CLIENT_ID: example-client-id
      VITE_API_BASE_URL: https://example.execute-api.us-east-1.amazonaws.com

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Run Playwright
        run: npm run e2e

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 3
