name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - "tools/lambda_release/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/lambda-release.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lambda-release-tools:
    name: Lambda Release Tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: python -m ruff check tools/lambda_release
      - name: Ruff format
        run: python -m ruff format --check tools/lambda_release
      - name: Mypy
        run: python -m mypy tools/lambda_release
      - name: Unit tests
        run: python -m pytest tools/lambda_release/tests -v

  students-api:
    name: Students API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/students-api/app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r backend/students-api/app/requirements.txt

      - name: Ruff lint
        run: python -m ruff check backend/students-api

      - name: Ruff format
        run: python -m ruff format --check backend/students-api

      - name: Mypy
        run: python -m mypy backend/students-api

      - name: Unit tests with coverage
        run: |
          python -m pytest \
            backend/students-api/tests/unit \
            -v \
            --cov=backend/students-api/app/students_api \
            --cov-report=term-missing

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          version: "1.165.0"

      - name: Validate SAM template
        run: |
          sam validate \
            --template-file backend/students-api/template.local.yaml \
            --lint

      - name: Build SAM application
        run: |
          sam build \
            --template-file backend/students-api/template.local.yaml

  users-api:
    name: Users API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/users-api/app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r backend/users-api/app/requirements.txt

      - name: Ruff lint
        run: python -m ruff check backend/users-api

      - name: Ruff format
        run: python -m ruff format --check backend/users-api

      - name: Mypy
        run: python -m mypy backend/users-api

      - name: Unit tests with coverage
        run: |
          python -m pytest \
            backend/users-api/tests/unit \
            -v \
            --cov=backend/users-api/app/users_api \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          version: "1.165.0"

      - name: Validate SAM template
        run: |
          sam validate \
            --template-file backend/users-api/template.local.yaml \
            --lint

      - name: Build SAM application
        run: |
          sam build \
            --template-file backend/users-api/template.local.yaml
